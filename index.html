<style>
:root{--bg:#f1f5f2;--cd:#fff;--tx:#1b2b22;--mu:#5c6e63;--pr:#1f7a4d;--p2:#e3f2ea;--bd:#d6e0d9;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101813;--cd:#18231c;--tx:#e6efe9;--mu:#9bb0a3;--pr:#4cc489;--p2:#1d3a2b;--bd:#2c3d33;--er:#f2b8b5}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}.side{width:210px;background:var(--cd);border-right:1px solid var(--bd);padding:12px 8px;flex:none}
.side h2{font-size:15px;margin:4px 8px 2px;color:var(--pr)}.side small{display:block;margin:0 8px 10px;color:var(--mu);font-size:11.5px}
.side a{display:block;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--tx)}.side a.on{background:var(--p2);color:var(--pr);font-weight:600}
.main{flex:1;padding:16px;min-width:0}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}
h1{font-size:19px;margin:0 0 10px}h3{margin:0 0 8px}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px}label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:8px 0 3px}
label.c{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--tx);margin:3px 0}label.c input{width:auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--pr);background:var(--pr);color:#fff;padding:7px 13px;font-weight:600}
button.s{background:transparent;color:var(--pr)}button.d{background:transparent;color:var(--er);border-color:var(--er)}button.x{padding:3px 8px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row select{width:auto;min-width:160px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mu);font-size:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.st{background:var(--p2);border-radius:10px;padding:12px}.st b{font-size:24px;display:block;color:var(--pr)}
#md{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:20}#md[hidden]{display:none}
.mb{background:var(--cd);border-radius:12px;padding:16px;width:100%;max-width:560px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--p2);color:var(--pr)}.mu{color:var(--mu)}
.num{display:flex;flex-wrap:wrap;gap:5px}.num button{width:36px;padding:5px 0;background:transparent;color:var(--tx);border-color:var(--bd)}.num button.a{background:var(--p2);border-color:var(--pr)}.num button.cur{background:var(--pr);color:#fff}
.opt{display:flex;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:9px;margin:7px 0;cursor:pointer}.opt.on{border-color:var(--pr);background:var(--p2)}
.kartu{display:inline-block;border:1px solid #000;padding:10px;margin:6px;width:260px;color:#000;background:#fff;font-size:13px}
@media (max-width:720px){.app{display:block}.side{width:auto;display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--bd)}.side h2,.side small{display:none}.side a{white-space:nowrap}}
#ld{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;z-index:30}#ld[hidden]{display:none}
.ft{text-align:center;color:var(--mu);font-size:12px;line-height:1.6;padding:16px 8px 8px;margin-top:28px;border-top:1px solid var(--bd)}.ft b{color:var(--tx)}
body.anti{-webkit-user-select:none;user-select:none}.wm{position:fixed;inset:0;pointer-events:none;opacity:.16;z-index:5}#wr{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}#wr[hidden]{display:none}#wr .b{background:var(--cd);border:3px solid var(--er);border-radius:14px;padding:20px;max-width:420px;text-align:center}
.po{display:none}@media print{.side,.no{display:none!important}.main{padding:0}.po{display:block}}

const logoH=(px)=>`<div style="text-align:center;margin-bottom:8px"><img src="${LOGO}" alt="Logo MTsN 3 Subang" style="height:${px}px;width:auto"></div>`;
const seed=()=>({cfg:{nama:'CBT MTsN 3 Subang',ket:'Ujian Online Berbasis Komputer'},mapel:[],guru:[],topik:[],soal:[],grp:[],pes:[],tes:[],token:{},hasil:[],role:'admin'});
let PEND={},PBUSY=0,OFF=0,S=seed(),PUB={...S.cfg},AU=null,SNAP={},STAT='',TK='';
const api=async b=>{try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return await r.json()}catch(e){return{ok:false,err:'Koneksi gagal. Periksa internet atau URL API. ('+(e.message||e)+')'}}};
const busy=on=>{$('#ld').hidden=!on};
const status=t=>{STAT=t;const e=$('#ss');if(e)e.textContent=t};

const TB=['mapel','guru','topik','soal','grp','pes','tes','hasil'];
function snap(){SNAP={};TB.forEach(t=>{SNAP[t]={};(S[t]||[]).forEach(r=>{SNAP[t][r.id]=JSON.stringify(r)})});SNAP.cfg=JSON.stringify(S.cfg);SNAP.token=JSON.stringify(S.token)}
let sq=Promise.resolve();
function save(){if(!AU)return Promise.resolve();const ch={};
TB.forEach(t=>{const up=[],ids={};S[t].forEach(r=>{ids[r.id]=1;if(SNAP[t][r.id]!==JSON.stringify(r))up.push(r)});const rm=Object.keys(SNAP[t]).filter(i=>!ids[i]);if(up.length||rm.length)ch[t]={up,rm}});
if(SNAP.cfg!==JSON.stringify(S.cfg))ch.cfg=S.cfg;{const ot=JSON.parse(SNAP.token||'{}'),tk={};Object.keys(S.token||{}).forEach(k=>{if(JSON.stringify(ot[k])!==JSON.stringify(S.token[k]))tk[k]=S.token[k]});if(Object.keys(tk).length)ch.token=tk}
if(!Object.keys(ch).length)return Promise.resolve();
const na=ch.cfg&&S.role!=='guru'?{u:S.cfg.au,p:S.cfg.ap||AU.p}:null;snap();status('Menyimpan…');
return sq=sq.then(()=>api({action:'sync',auth:AU,ch})).then(r=>{if(r.ok){if(na)AU=na;status('Tersimpan ✓')}else{status('Gagal menyimpan');alert('Gagal menyimpan ke Google Sheets: '+r.err+'\nGunakan “Muat ulang data” lalu ulangi perubahan.')}})}
async function loadAdmin(q){if(!q)busy(true);await sq;const r=await api({action:'alogin',u:AU.u,p:AU.p});if(!q)busy(false);if(!r.ok){if(!q)alert(r.err);return}S=r.S;snap();status(q?'Diperbarui '+new Date().toLocaleTimeString('id-ID'):'Data dimuat');render()}

const gN=i=>(S.grp.find(x=>x.id===i)||{}).nama||'-',tN=i=>(S.topik.find(x=>x.id===i)||{}).nama||'-',mN=i=>(S.mapel.find(x=>x.id===i)||{}).nama||'-',myM=()=>S.role==='guru'?((S.guru[0]||{}).m||[]):S.mapel.map(x=>x.id),mOpts=()=>S.mapel.filter(x=>myM().includes(x.id)).map(x=>[x.id,x.nama]);

const sv=(name,txt)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([name.endsWith('.csv')?'\ufeff'+txt:txt],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};

const FOOT_NAMA='MTsN 3 Subang',FOOT_ALAMAT='Kabupaten Subang, Jawa Barat',FOOT_KET='Sistem Ujian Online Berbasis Komputer (CBT)';
const footH=()=>`<footer class="ft no"><b>${E(FOOT_KET)}</b><br>© ${new Date().getFullYear()} ${E(FOOT_NAMA)} · ${E(FOOT_ALAMAT)}<br>Seluruh hak dilindungi. Dilarang menyebarluaskan soal dan kunci jawaban.</footer>`;
const IMG={},IMGP={};
const imgTag=(id,st)=>id?`<img data-img="${E(id)}" ${IMG[id]?`src="${IMG[id]}"`:''} alt="gambar" style="${st||'max-width:100%;max-height:320px;border-radius:8px;display:block;margin:8px 0'}">`:'';
function getImg(id){if(IMG[id])return Promise.resolve(IMG[id]);return IMGP[id]||(IMGP[id]=api({action:'img',id,auth:AU,tk:TK}).then(r=>{delete IMGP[id];if(r.ok){IMG[id]=r.d;document.querySelectorAll('img[data-img="'+id+'"]').forEach(x=>x.src=r.d)}return IMG[id]}))}
function hydrate(){document.querySelectorAll('img[data-img]').forEach(im=>{const id=im.dataset.img;if(!IMG[id])getImg(id)})}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej('File tidak terbaca');fr.onload=()=>{const im=new Image();im.onerror=()=>rej('File bukan gambar');im.onload=()=>{const sc=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let q=.78,d;do{d=c.toDataURL('image/jpeg',q);q-=.1}while(d.length>140000&&q>.2);d.length>280000?rej('Gambar terlalu besar/rumit'):res(d)};im.src=fr.result};fr.readAsDataURL(file)})}
async function pickImg(k,inp){const f=inp.files[0];if(!f)return;PBUSY++;const box=$('#ip_'+k);box.innerHTML='<span class=mu>Mengunggah…</span>';try{const d=await compress(f);const r=await api({action:'imgup',auth:AU,d});if(!r.ok)throw r.err;IMG[r.id]=d;PEND[k]=r.id;box.innerHTML=imgTag(r.id,'max-height:140px;max-width:100%;border-radius:6px')}catch(e){box.innerHTML='<span style="color:var(--er)">Gagal: '+E(e.message||e)+'</span>'}PBUSY--}
function clrImg(k){PEND[k]='';$('#ip_'+k).innerHTML=''}
async function cleanImg(){if(!confirm('Hapus gambar yang tidak dipakai soal mana pun?'))return;busy(true);const r=await api({action:'imgclean',auth:AU});busy(false);alert(r.ok?r.n+' gambar tidak terpakai dihapus.':r.err)}
function fld(f){const v=f.v??'',n=`name="${f.k}"`;let i;
if(f.t==='select')i=`<select ${n}>${f.o.map(([a,b])=>`<option value="${E(a)}" ${a==v?'selected':''}>${E(b)}</option>`).join('')}</select>`;
else if(f.t==='multi')return`<label>${f.l}</label>`+f.o.map(([a,b])=>`<label class=c><input type=checkbox ${n} value="${a}" ${(v||[]).includes(a)?'checked':''}>${E(b)}</label>`).join('');
else if(f.t==='check')return`<label class=c><input type=checkbox ${n} ${v?'checked':''}>${f.l}</label>`;
else if(f.t==='img')return`<label>${f.l}</label><div id="ip_${f.k}">${imgTag(PEND[f.k],'max-height:140px;max-width:100%;border-radius:6px')}</div><div class=row><input type=file accept="image/*" onchange="pickImg('${f.k}',this)" style="width:auto"><button type=button class="d x" onclick="clrImg('${f.k}')">Hapus gambar</button></div>`;
else if(f.t==='area')i=`<textarea ${n}>${E(v)}</textarea>`;else i=`<input ${n} type="${f.t||'text'}" value="${E(v)}">`;
return`<label>${f.l}</label>${i}`}
function form(title,fs,ok){const m=$('#md');m.innerHTML=`<div class=mb><h3>${title}</h3>${fs.map(fld).join('')}<div class=row><button id=okb>Simpan</button><button class=s onclick=closeM()>Batal</button></div></div>`;m.hidden=false;hydrate();
$('#okb').onclick=()=>{const o={};fs.forEach(f=>{const els=[...m.querySelectorAll(`[name="${f.k}"]`)];o[f.k]=f.t==='img'?(PEND[f.k]||''):f.t==='multi'?els.filter(e=>e.checked).map(e=>e.value):f.t==='check'?els[0].checked:els[0].value});if(ok(o)!==false){save();closeM();render()}}}
const del=(arr,i,msg)=>{if(confirm(msg||'Hapus data ini?')){const k=S[arr].findIndex(x=>x.id===i);S[arr].splice(k,1);save();render()}};
function go(p){if(p==='reload'){loadAdmin();return}page=p;render()}

else{const r=await api({action:'plogin',u,p});if(!r.ok){$('#le').textContent=r.err;return}TK=r.tk;OFF=(r.now||Date.now())-Date.now();P={...r.pes,pw:p};S={cfg:r.cfg,mapel:r.mapel||[],guru:[],topik:[],soal:[],grp:r.grp,pes:[],tes:r.tes,token:{},hasil:r.hasil};AU=null;mode='peserta';cur=null;render()}}
