table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mu);font-size:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.st{background:var(--p2);border-radius:10px;padding:12px}.st b{font-size:24px;display:block;color:var(--pr)}

.mb{background:var(--cd);border-radius:12px;padding:16px;width:100%;max-width:560px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--p2);color:var(--pr)}.mu{color:var(--mu)}

.opt{display:flex;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:9px;margin:7px 0;cursor:pointer}.opt.on{border-color:var(--pr);background:var(--p2)}
.kartu{display:inline-block;border:1px solid #000;padding:10px;margin:6px;width:260px;color:#000;background:#fff;font-size:13px}
@media (max-width:720px){.app{display:block}.side{width:auto;display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--bd)}.side h2,.side small{display:none}.side a{white-space:nowrap}}
#ld{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;z-index:30}#ld[hidden]{display:none}
.ft{text-align:center;color:var(--mu);font-size:12px;line-height:1.6;padding:16px 8px 8px;margin-top:28px;border-top:1px solid var(--bd)}.ft b{color:var(--tx)}
body.anti{-webkit-user-select:none;user-select:none}.wm{position:fixed;inset:0;pointer-events:none;opacity:.16;z-index:5}#wr{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}#wr[hidden]{display:none}#wr .b{background:var(--cd);border:3px solid var(--er);border-radius:14px;padding:20px;max-width:420px;text-align:center}
.dd{border:1px solid var(--bd);border-radius:8px;margin:6px 0;background:var(--bg)}.dd summary{padding:8px 10px;cursor:pointer;font-weight:600}.ddl{padding:6px 10px;max-height:280px;overflow:auto;border-top:1px solid var(--bd)}
.po{display:none}@media print{.side,.no{display:none!important}.main{padding:0}.po{display:block}}

return`<div class=card><b>${E(t.nama)}</b> <span class=tag>${E(mN(t.m))}</span><div class=mu>${E(t.desk||'')} · ${t.durasi} menit · ${t.ids.length} soal</div><div class=row>${act}</div></div>`}).join('')||'<div class=card>Belum ada tes untuk group Anda.</div>')+footH()+'</div>'}
async function mulai(tid){const t=S.tes.find(x=>x.id===tid);if(t&&t.anti!==false&&document.documentElement.requestFullscreen){try{document.documentElement.requestFullscreen().then(()=>{VIO.fs=true}).catch(()=>{})}catch(e){}}let h=S.hasil.find(x=>x.tes===tid&&x.p===P.id),tk='';
if(!h&&t.token){tk=prompt('Masukkan token tes:');if(!tk){exitFS();return}}
busy(true);await wait(Math.random()*LOGIN_JITTER);const r=await api({action:'pstart',tk:TK,tes:tid,token:tk});busy(false);
if(!r.ok){exitFS();alert(r.err);return}
VIO.mute=Date.now()+2500;try{history.pushState(null,'',location.href)}catch(e){}
if(r.now)OFF=r.now-Date.now();r.soal.forEach(q=>{if(!S.soal.some(x=>x.id===q.id))S.soal.push(q);[q.img,...(q.oi||[])].filter(Boolean).forEach(getImg)});
{const lc=lsGet(r.h.id);if(lc&&!r.h.fin)r.h.a={...(r.h.a||{}),...lc}}const i=S.hasil.findIndex(x=>x.id===r.h.id);if(i<0)S.hasil.push(r.h);else S.hasil[i]=r.h;
cur={h:r.h.id,i:0};clearInterval(tmr);tmr=setInterval(tick,1000);render()}
function tick(){const h=S.hasil.find(x=>x.id===cur?.h);if(!h||h.fin){clearInterval(tmr);return}const t=S.tes.find(x=>x.id===h.tes),r=endT(h,t)-(Date.now()+OFF);if(r<=0){clearInterval(tmr);if(h.tout)return;h.tout=1;busy(true);$('#ld').textContent='Waktu habis. Mengirim jawaban…';setTimeout(()=>finP(h,true),Math.random()*AUTO_JITTER);return}const e=$('#tm');if(e)e.textContent=Math.floor(r/60000)+':'+String(Math.floor(r/1000)%60).padStart(2,'0')}
function pushAns(){clearTimeout(pt);PT_AT=0;const h=S.hasil.find(x=>x.id===cur?.h);if(!h||h.fin)return Promise.resolve();const sig=JSON.stringify(h.a);if(h._ls===sig)return Promise.resolve();const set=t=>{const e=$('#sv');if(e)e.textContent=t};set('Menyimpan…');
return api({action:'pans',tk:TK,h:h.id,a:h.a}).then(r=>{if(r.ok)h._ls=sig;else{clearTimeout(pt);pt=setTimeout(pushAns,15000+Math.random()*15000)}set(r.ok?'Tersimpan ✓':'Gagal simpan, mencoba lagi…')})}
async function finP(h,auto){clearInterval(tmr);clearTimeout(pt);busy(true);let r=await api({action:'pfin',tk:TK,h:h.id,a:h.a});if(!r.ok)r=await api({action:'pfin',tk:TK,h:h.id,a:h.a});busy(false);
if(!r.ok){alert('Gagal mengirim jawaban: '+r.err+'\nPeriksa koneksi lalu tekan Selesai lagi.');h.tout=0;cur&&(tmr=setInterval(tick,1000));return}
lsDel(h.id);Object.assign(h,r.h);h.fin=true;exitFS();hideWarn();if(auto)alert('Waktu habis. Jawaban Anda sudah dikirim.');render()}
function examView(){const h=S.hasil.find(x=>x.id===cur.h),t=S.tes.find(x=>x.id===h.tes);if(h.fin){clearInterval(tmr);return`<div class=card><h1>Tes selesai ✔</h1><p>Jawaban Anda sudah tersimpan.</p>${t.th?`<div class=st><b>${h.nilai}</b>Nilai Anda</div>`:''}<div class=row><button onclick="cur=null;render()">Kembali</button></div></div>`}
const sid=h.ids[cur.i],s=S.soal.find(x=>x.id===sid),pm=h.perm[sid];
return`<div class="row" style="justify-content:space-between"><b>${E(t.nama)}</b><span><span id=sv class=mu></span> <span class=tag>⏱ <span id=tm>--:--</span></span></span></div>
<div class=card><div class=mu>Soal ${cur.i+1} dari ${h.ids.length}</div><p style="font-size:16px;white-space:pre-wrap">${E(s.q)}</p>${imgTag(s.img)}${pm.map((o,n)=>`<div class="opt ${h.a[sid]===o?'on':''}" onclick="ans('${sid}',${o})"><b>${'ABCDE'[n]}.</b><span>${E(s.o[o]||'')}${imgTag((s.oi||[])[o],'max-width:100%;max-height:200px;display:block;margin-top:4px;border-radius:6px')}</span></div>`).join('')}
<div class=row><button class=s onclick="nav(-1)" ${cur.i?'':'disabled'}>← Sebelumnya</button><button class=s onclick="nav(1)" ${cur.i<h.ids.length-1?'':'disabled'}>Berikutnya →</button><button onclick="fin()" style="margin-left:auto">Selesai</button></div></div>
<div class=card><div class=num>${h.ids.map((i,n)=>`<button class="${n===cur.i?'cur':h.a[i]!==undefined?'a':''}" onclick="cur.i=${n};render()">${n+1}</button>`).join('')}</div></div>`}
function ans(s,o){const h=S.hasil.find(x=>x.id===cur.h);if(!h||h.tout||h.fin)return;h.a[s]=o;lsSet(h.id,h.a);{const pm=h.perm[s]||[];document.querySelectorAll('#root .opt').forEach((el,n)=>el.classList.toggle('on',pm[n]===o));const nb=document.querySelectorAll('#root .num button')[cur.i];if(nb&&!nb.classList.contains('cur'))nb.classList.add('a')}const e=$('#sv');if(e)e.textContent='Tersimpan di perangkat ✓';if(!PT_AT||Date.now()-PT_AT>SYNC_MIN+SYNC_RND+5000){PT_AT=Date.now();clearTimeout(pt);pt=setTimeout(pushAns,SYNC_MIN+Math.random()*SYNC_RND)}}
const nav=d=>{cur.i+=d;render()};
function fin(){const h=S.hasil.find(x=>x.id===cur.h),k=h.ids.filter(i=>h.a[i]===undefined).length;VIO.mute=Date.now()+60000;const okc=confirm(k?`Masih ${k} soal belum dijawab. Akhiri tes?`:'Akhiri tes dan kirim jawaban?');VIO.mute=Date.now()+1500;if(okc)finP(h)}

/* ---------- PENGAMAN ANTI-MENYONTEK ---------- */
const VIO={last:0,mute:0,fs:false};
const exitFS=()=>{VIO.fs=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}};
const curH=()=>cur&&S.hasil.find(x=>x.id===cur.h);
function antiOn(){if(mode!=='peserta'||!cur)return false;const h=curH();if(!h||h.fin)return false;const t=S.tes.find(x=>x.id===h.tes);return !!t&&t.anti!==false}
function wmH(){if(!antiOn())return'';const tx=E((P.nama||'')+' · '+(P.u||'')),svg="<svg xmlns='http://www.w3.org/2000/svg' width='300' height='170'><text x='150' y='90' text-anchor='middle' transform='rotate(-25 150 85)' font-family='Arial' font-size='15' font-weight='bold' fill='%23777'>"+tx.replace(/#/g,'')+"</text></svg>";return`<div class=wm style="background-image:url(&quot;data:image/svg+xml,${encodeURIComponent(svg.replace('%23777','#777'))}&quot;)"></div>`}
function hideWarn(){const w=$('#wr');if(w)w.hidden=true}
function showWarn(j,n,mx){const w=$('#wr');if(!w)return;w.innerHTML=`<div class=b><div style="font-size:42px">⚠️</div><h3>Pelanggaran ${n}${mx?' dari '+mx:''}</h3><p>${E(j)}.</p><p class=mu>${mx?'Jika melebihi batas, ujian otomatis dikumpulkan.':'Tindakan ini dicatat dan dilihat pengawas.'}</p><div class=row style="justify-content:center"><button onclick="hideWarn();try{if(VIO.fs&&!document.fullscreenElement)document.documentElement.requestFullscreen()}catch(e){}">Kembali ke ujian</button></div></div>`;w.hidden=false}
function viol(j){if(!antiOn())return;const now=Date.now();if(now<VIO.mute||now-VIO.last<1500)return;VIO.last=now;const h=curH(),t=S.tes.find(x=>x.id===h.tes),mx=t.maxv===undefined?3:(+t.maxv||0);h.v=(h.v||0)+1;
api({action:'pviol',tk:TK,h:h.id,j,a:h.a}).then(r=>{if(!r.ok)return;h.v=r.v;if(r.fin){Object.assign(h,r.h);h.fin=true;clearInterval(tmr);clearTimeout(pt);exitFS();hideWarn();render();alert('Ujian dikumpulkan otomatis karena pelanggaran melebihi batas ('+mx+'×).')}});showWarn(j,h.v,mx)}
function initAnti(){document.addEventListener('visibilitychange',()=>{if(document.hidden)viol('Berpindah tab atau aplikasi')});
window.addEventListener('blur',()=>viol('Jendela ujian tidak aktif'));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&VIO.fs)viol('Keluar dari layar penuh')});
['copy','cut','paste','contextmenu','dragstart','selectstart'].forEach(e=>document.addEventListener(e,ev=>{if(antiOn())ev.preventDefault()}));
document.addEventListener('keydown',ev=>{if(!antiOn())return;const k=String(ev.key).toLowerCase(),c=ev.ctrlKey||ev.metaKey;
if(ev.key==='F12'||(c&&ev.shiftKey&&'ijc'.includes(k))||(c&&k==='u')){ev.preventDefault();viol('Mencoba membuka alat pengembang')}
else if(c&&k==='p'){ev.preventDefault();viol('Mencoba mencetak halaman ujian')}
else if(c&&'cvxas'.includes(k))ev.preventDefault()});
document.addEventListener('keyup',ev=>{if(antiOn()&&ev.key==='PrintScreen'){try{navigator.clipboard.writeText('')}catch(e){}viol('Mengambil tangkapan layar')}});
window.addEventListener('beforeunload',ev=>{if(antiOn()){ev.preventDefault();ev.returnValue=''}});
window.addEventListener('popstate',()=>{if(antiOn()){try{history.pushState(null,'',location.href)}catch(e){}}})}
function render(){$('#root').innerHTML=mode==='login'?loginView():mode==='admin'?adminView():pesView();if(mode==='peserta'&&cur)tick();hydrate();if(document.body.classList)document.body.classList.toggle('anti',!!antiOn())}
initAnti();render();
setInterval(()=>{const a=document.activeElement;if(mode==='admin'&&AU&&!document.hidden&&$('#md').hidden&&['dash','hasil','rekap'].includes(page)&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))loadAdmin(true)},150000);
setTimeout(()=>{api({action:'info'}).then(r=>{if(r.ok){PUB=r.cfg;if(mode==='login'&&!(($('#lu')||{}).value)){S.cfg={...PUB};render()}}})},Math.random()*3000);
